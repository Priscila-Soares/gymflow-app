<div class="container">
  <h2>Cadastrar Aluno</h2>

  <form (ngSubmit)="salvar()" #alunoForm="ngForm">
    <div class="campo">
      <label for="nome">Nome</label>
      <input
        type="text"
        id="nome"
        name="nome"
        [(ngModel)]="aluno.nome"
        required
      />
    </div>

    <div class="campo">
      <label for="email">E-mail</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="aluno.email"
        required
      />
    </div>

    <div class="campo">
      <label for="idade">Idade</label>
      <input
        type="number"
        id="idade"
        name="idade"
        [(ngModel)]="aluno.idade"
      />
    </div>

    <div class="campo">
      <label for="peso">Peso</label>
      <input
        type="number"
        step="0.01"
        id="peso"
        name="peso"
        [(ngModel)]="aluno.peso"
      />
    </div>

    <div class="campo">
      <label for="altura">Altura</label>
      <input
        type="number"
        step="0.01"
        id="altura"
        name="altura"
        [(ngModel)]="aluno.altura"
      />
    </div>

    <div class="campo">
      <label for="objetivo">Objetivo</label>
      <input
        type="text"
        id="objetivo"
        name="objetivo"
        [(ngModel)]="aluno.objetivo"
      />
    </div>

    <button type="submit">Salvar</button>
  </form>
</div>
