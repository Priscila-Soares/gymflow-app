<h2>Cadastrar Exercício</h2>

<form (ngSubmit)="salvar()">
  <div>
    <label for="nome">Nome</label>
    <input
      type="text"
      id="nome"
      name="nome"
      [(ngModel)]="exercicio.nome"
      required
    />
  </div>

  <div>
    <label for="grupoMuscular">Grupo Muscular</label>
    <input
      type="text"
      id="grupoMuscular"
      name="grupoMuscular"
      [(ngModel)]="exercicio.grupoMuscular"
      required
    />
  </div>

  <div>
    <label for="descricao">Descrição</label>
    <textarea
      id="descricao"
      name="descricao"
      [(ngModel)]="exercicio.descricao"
    ></textarea>
  </div>

  <button type="submit">Salvar</button>
</form>
