<h2>Cadastrar Treino</h2>

<form (ngSubmit)="salvar()">
  <div>
    <label for="nome">Nome do treino</label>
    <input
      type="text"
      id="nome"
      name="nome"
      [(ngModel)]="treino.nome"
      required
    />
  </div>

  <div>
    <label for="aluno">Aluno</label>
    <select
      id="aluno"
      name="aluno"
      [(ngModel)]="treino.alunoId"
      required
    >
      <option [ngValue]="0">Selecione um aluno</option>
      <option *ngFor="let aluno of alunos" [ngValue]="aluno.id">
        {{ aluno.nome }}
      </option>
    </select>
  </div>

  <div>
    <label>Exercícios</label>

    <div class="checkbox-list">
      <label *ngFor="let exercicio of exercicios" class="checkbox-item">
        <input
          type="checkbox"
          [value]="exercicio.id"
          (change)="selecionarExercicio(exercicio.id!, $event)"
        />
        {{ exercicio.nome }} - {{ exercicio.grupoMuscular }}
      </label>
    </div>
  </div>

  <button type="submit">Salvar</button>
</form>
